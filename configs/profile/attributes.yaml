cognitive_level_order:
  - preschool
  - primary_1
  - primary_2
  - primary_3
  - primary_4
  - primary_5
  - primary_6
  - junior_1
  - junior_2
  - junior_3
  - senior_1
  - senior_2
  - senior_3
  - vocational

attributes:
  disabilities:
    type: list
    required: true
    values: [visual, hearing, intellectual, autism]
  severity:
    type: enum
    required: true
    values: [mild, moderate, severe]
  cognitive_level:
    type: enum
    required: true
    values: [preschool, primary_1, primary_2, primary_3, primary_4, primary_5, primary_6, junior_1, junior_2, junior_3, senior_1, senior_2, senior_3, vocational]
  sensory_preference:
    type: enum
    required: false
    values: [visual_first, audio_first, tactile_aided, mixed]
  rehab_goals:
    type: list
    required: false
    values: [language, sensory_integration, social, cognitive]
  learning_pace:
    type: enum
    required: true
    values: [fast, medium, slow]

# 学习节奏指数映射（0~1 小数），用于界面可视化
learning_pace_index:
  fast: 0.85
  medium: 0.6
  slow: 0.35

# 认知等级中文名（用于 Prompt 展示，避免直接出现英文键）
cognitive_level_labels:
  preschool: 学前
  primary_1: 小学一年级
  primary_2: 小学二年级
  primary_3: 小学三年级
  primary_4: 小学四年级
  primary_5: 小学五年级
  primary_6: 小学六年级
  junior_1: 初中一年级
  junior_2: 初中二年级
  junior_3: 初中三年级
  senior_1: 高中一年级
  senior_2: 高中二年级
  senior_3: 高中三年级
  vocational: 职教
