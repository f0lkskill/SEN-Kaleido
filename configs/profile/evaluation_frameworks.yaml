dimensions:
  knowledge:
    name: 知识掌握
  participation:
    name: 课堂参与
  behavior:
    name: 行为改善
  rehabilitation:
    name: 身心康复

base_weights:
  knowledge: 0.3
  participation: 0.2
  behavior: 0.2
  rehabilitation: 0.3

goal_weight_bonus:
  language:
    knowledge: 0.1
  sensory_integration:
    rehabilitation: 0.1
  social:
    behavior: 0.1
  cognitive:
    knowledge: 0.1

frameworks:
  visual:
    dimensions: [knowledge, participation, behavior, rehabilitation]
    indicators:
      - key: auditory_comprehension
        name: 听觉理解
        dimension: knowledge
        core: true
        observations:
          - key: instruction_recall
            name: 听指令回忆正确率
            method: quantitative
            frequency: per_lesson
            evidence_sources: [item_response, classroom_observation]
            rubric: knowledge
      - key: braille_literacy
        name: 盲文识字
        dimension: knowledge
        core: false
        min_cognitive_level: primary_low
        observations:
          - key: braille_recognition
            name: 盲文点字认读
            method: quantitative
            frequency: weekly
            evidence_sources: [item_response, work_sample]
            rubric: knowledge
      - key: auditory_attention
        name: 听觉注意
        dimension: rehabilitation
        core: true
        observations:
          - key: name_response
            name: 听到名字有反应
            method: qualitative
            frequency: per_lesson
            evidence_sources: [classroom_observation]
            rubric: rehabilitation
      - key: orientation_mobility
        name: 定向行走
        dimension: rehabilitation
        core: false
        min_cognitive_level: primary_low
        observations:
          - key: independent_walk
            name: 独立完成路线
            method: quantitative
            frequency: phase
            evidence_sources: [rehab_record, video_event]
            rubric: rehabilitation
      - key: class_participation
        name: 课堂参与
        dimension: participation
        core: true
        observations:
          - key: response_count
            name: 主动回应次数
            method: quantitative
            frequency: per_lesson
            evidence_sources: [classroom_observation]
            rubric: participation
      - key: emotional_regulation
        name: 情绪调节
        dimension: behavior
        core: true
        observations:
          - key: calm_down
            name: 情绪平复时长
            method: quantitative
            frequency: weekly
            evidence_sources: [classroom_observation]
            rubric: behavior

  hearing:
    dimensions: [knowledge, participation, behavior, rehabilitation]
    indicators:
      - key: lip_reading
        name: 口型识别
        dimension: knowledge
        core: true
        observations:
          - key: lip_word_recognition
            name: 口型辨认正确率
            method: quantitative
            frequency: per_lesson
            evidence_sources: [item_response, classroom_observation]
            rubric: knowledge
      - key: sign_language
        name: 手语表达
        dimension: knowledge
        core: false
        observations:
          - key: sign_expression
            name: 手语表达完整度
            method: qualitative
            frequency: weekly
            evidence_sources: [classroom_observation, video_event]
            rubric: knowledge
      - key: written_expression
        name: 书面表达
        dimension: knowledge
        core: true
        min_cognitive_level: primary_high
        observations:
          - key: sentence_writing
            name: 句子书写正确率
            method: quantitative
            frequency: weekly
            evidence_sources: [item_response, work_sample]
            rubric: knowledge
      - key: visual_attention
        name: 视觉注意
        dimension: rehabilitation
        core: true
        observations:
          - key: gaze_tracking
            name: 注视目标时长
            method: quantitative
            frequency: per_lesson
            evidence_sources: [classroom_observation, video_event]
