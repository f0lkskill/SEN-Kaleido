# 评价框架配置（当前阶段）
# 说明：课题研究方向尚未确定，暂不设各障碍类型的专有指标；
# 全部学生统一使用两个公共指标：上课参与度、练习完成质量。
# dimensions：评价维度定义；base_weights：维度基础权重（归一化前）。
dimensions:
  participation:
    name: 课堂参与
  practice:
    name: 练习质量

# 维度基础权重（最终会归一化，保证之和为 1）
base_weights:
  participation: 0.5
  practice: 0.5

# 康复目标对相关维度的权重加成（归一化前累加）
goal_weight_bonus:
  language:
    practice: 0.1
  cognitive:
    practice: 0.1
  social:
    participation: 0.1
  sensory_integration:
    participation: 0.1

# 维度指数推导模型（0~1，体现"当前可达/适切程度"，由属性确定性推导）
index_model:
  severity: {mild: 0.85, moderate: 0.65, severe: 0.45}
  cognitive_level: {preschool: 0.4, primary_low: 0.55, primary_high: 0.7, vocational: 0.8}
  learning_pace: {fast: 0.85, medium: 0.6, slow: 0.35}
  # 康复目标对相关维度的加成
  goal_bonus:
    language: {practice: 0.05}
    cognitive: {practice: 0.05}
    social: {participation: 0.05}
    sensory_integration: {participation: 0.05}

# 公共指标：所有学生共有，不随障碍类型或认知等级裁剪
public_indicators:
  - key: class_participation
    name: 上课参与度
    dimension: participation
    observations:
      - key: class_engagement
        name: 课堂参与程度
        method: qualitative
        frequency: per_lesson
        evidence_sources: [classroom_observation, teacher_rating]
        rubric: participation
  - key: practice_quality
    name: 练习完成质量
    dimension: practice
    observations:
      - key: practice_completion
        name: 练习完成质量
        method: quantitative
        frequency: weekly
        evidence_sources: [work_sample, item_response, teacher_rating]
        rubric: practice
