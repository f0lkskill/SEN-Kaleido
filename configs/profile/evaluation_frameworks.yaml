      - key: class_participation
        name: 课堂参与
        dimension: participation
        core: true
        observations:
          - key: response_count
            name: 主动回应次数
            method: quantitative
            frequency: per_lesson
            evidence_sources: [classroom_observation]
            rubric: participation
      - key: emotional_regulation
        name: 情绪调节
        dimension: behavior
        core: true
        observations:
          - key: calm_down
            name: 情绪平复时长
            method: quantitative
            frequency: weekly
            evidence_sources: [classroom_observation]
            rubric: behavior

  intellectual:
    dimensions: [knowledge, participation, behavior, rehabilitation]
    indicators:
      - key: life_skills
        name: 生活自理
        dimension: behavior
        core: true
        observations:
          - key: self_care_task
            name: 自理任务完成度
            method: qualitative
            frequency: weekly
            evidence_sources: [classroom_observation, rehab_record]
            rubric: behavior
      - key: instruction_comprehension
        name: 指令理解
        dimension: knowledge
        core: true
        observations:
          - key: simple_instruction
            name: 简单指令执行正确率
            method: quantitative
            frequency: per_lesson
