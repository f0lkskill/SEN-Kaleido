            rubric: participation
      - key: emotional_regulation
        name: 情绪调节
        dimension: behavior
        core: true
        observations:
          - key: calm_down
            name: 情绪平复时长
            method: quantitative
            frequency: weekly
            evidence_sources: [classroom_observation]
            rubric: behavior

  autism:
    dimensions: [knowledge, participation, behavior, rehabilitation]
    indicators:
      - key: social_interaction
        name: 社交互动
        dimension: behavior
        core: true
        observations:
