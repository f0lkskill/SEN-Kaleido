key: rehabilitation
name: 身心康复
levels:
  - level: 1
    label: 未达成
    description: 目标康复动作/反应未出现
    evidence: 需康复师或教师记录
  - level: 2
    label: 初步
    description: 在提示下偶尔出现目标反应
    evidence: 需康复师或教师记录
  - level: 3
    label: 基本
    description: 能较稳定出现目标反应
    evidence: 需阶段性训练记录
  - level: 4
    label: 熟练
    description: 目标反应稳定并能泛化到日常
    evidence: 需连续阶段训练记录
