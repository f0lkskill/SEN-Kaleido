# kaleido-forge 配置：云端模型参数与资源类型
llm:
  provider: deepseek            # deepseek | stub
  base_url: https://api.deepseek.com
  model: deepseek-flash
  temperature: 0.7
  # 推理型模型会把额度消耗在推理上导致正文为空，故留足上限（可用 4096/8192）
  max_tokens: 8192
  timeout: 120
  retries: 2
  # 密钥读取顺序：llm.api_key 配置 → 环境变量 api_key_env → 项目根 .env 文件
  api_key_env: DEEPSEEK_API_KEY
  # 也可直接填写 api_key；但更推荐放 .env（已被 .gitignore 忽略，避免密钥入库）
  # api_key: ""
  # 视觉理解与文本生成共用 deepseek-flash；如需单独指定可改 vision_model
  vision_model: deepseek-flash

# 学生画像分析：把某学生全部证据（文本 + 图像）送入视觉模型归纳
portrait:
  max_images: 6                 # 单次最多送入的图像张数
  max_image_bytes: 8388608      # 单张图像最大字节数（8MB）
  max_evidence: 200             # 单次最多分析的证据条数

# 基于原资源修订：控制原正文进入 Prompt 的长度
revision:
  max_source_chars: 6000        # 原资源正文最多截取字符数

resource_types:
  courseware: 分层知识点课件
  exercise: 个性化练习题库
  rehabilitation: 多模态康复素材
  interaction: 课堂互动辅助资源
  iep: 个别化教学方案
